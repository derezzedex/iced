[package]
name = "inspector"
version = "0.1.0"
authors = ["Richard Custodio <richardcustodio@pm.me>"]
edition = "2021"
publish = false

[dependencies]
iced.workspace = true
iced.features = ["advanced", "canvas", "highlighter", "tokio", "inspector", "svg"]

log.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
chrono = "0.4"

tokio.workspace = true
tokio.features = ["fs", "sync"]
